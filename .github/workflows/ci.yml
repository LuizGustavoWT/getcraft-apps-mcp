name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: test -f plugins/getcraft-apps-mcp/plugin.json
      - run: test -f plugins/getcraft-apps-mcp/.codex-plugin/plugin.json
      - run: test -f plugins/getcraft-apps-mcp/.claude-plugin/plugin.json
